name: Web sitesi

# site/ klasöründen siteyi üretir ve GitHub Pages'e yayınlar: https://kutsalkiremitci.github.io/robz-dpi/
# Türkçe kökte, İngilizce /en/, Rusça /ru/ altındadır; her dil kendi ekran görüntülerini (docs/screenshots/<dil>/) kullanır.
#
# Depo gizliyken yayınlamaz: site herkese açık olur, depo ise henüz açılmadı. Depo herkese açılınca
# Settings › Pages › Source: "GitHub Actions" seçilir; sonraki gönderimde (ya da elle çalıştırınca) site yayınlanır.
on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/**', 'assets/**', 'package.json', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  yayinla:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Yalnız yazı tipi paketi gerekir; kurulum betikleri (WinDivert indirme) çalıştırılmaz.
      - run: npm ci --ignore-scripts
      - run: node site/build.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
      # GitHub, yeni yüklenen dosyayı bazen birkaç saniye göremez ("No artifacts named github-pages"). İlk deneme
      # başarısız olursa kısa bir beklemeden sonra bir kez daha denenir.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
