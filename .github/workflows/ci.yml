name: Testler

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # npm ci, WinDivert'i resmi sürümünden indirir ve engine.lock.json'daki özetlerle doğrular.
      - run: npm ci
      - name: WinDivert indirildi mi
        run: npm run engine
      # Motorun paket mantığı ağa dokunmadan sınanır; süzgeçler WinDivert.dll ile derlenir (sürücü yüklenmez).
      - run: npm test
