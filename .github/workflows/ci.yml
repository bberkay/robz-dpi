name: Testler

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # npm ci, WinDivert'i resmi sürümünden indirir ve engine.lock.json'daki özetlerle doğrular.
      - run: npm ci
      - name: WinDivert indirildi mi
        run: npm run engine
      # Motorun paket mantığı ağa dokunmadan sınanır; süzgeçler WinDivert.dll ile derlenir (sürücü yüklenmez).
      - run: npm test

  linux:
    name: Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Derleme gereksinimleri
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev xvfb
      - run: npm ci
      - run: npm test
      - name: Derleyici uyarıları
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Paketi derle (.deb)
        run: npx tauri build --bundles deb
      - name: Paketi kur
        run: sudo apt-get install -y ./src-tauri/target/release/bundle/deb/*.deb
      # Arayüz sanal bir ekranda açılır; 15 saniye boyunca kapanmazsa (timeout 124 döndürürse) açılış sağlamdır.
      - name: Arayüz açılıyor mu
        run: |
          set +e
          xvfb-run -a timeout 15 robz-dpi
          code=$?
          echo "çıkış kodu: $code"
          test "$code" -eq 124
      # Motor gerçek systemd, nftables ve paket kuyruğuyla kurulur, bir siteye bağlanılır, sonra kaldırılır.
      - name: Motoru uçtan uca dene
        run: sudo SMOKE_PACKAGE=robz-dpi bash scripts/linux-smoke.sh
