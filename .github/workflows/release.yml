# Sürüm yayınlama: "vX.Y.Z" etiketi gönderilince kurulum dosyası derlenir ve GitHub sürümüne yüklenir.
#
#   1. Sürüm numarasını üç dosyada aynı yap: package.json, src-tauri/Cargo.toml, src-tauri/tauri.conf.json
#   2. CHANGELOG.md'ye "## X.Y.Z" başlığıyla notları yaz
#   3. git tag vX.Y.Z && git push origin vX.Y.Z
#
# Robz Hub bu sürümdeki "RobzDPI-Setup-X.Y.Z.exe" dosyasını kurar; dosya adını değiştirme. README'deki indirme
# bağlantıları sabit adlı "RobzDPI-Setup.exe" ve "RobzDPI-Portable.zip" dosyalarına gider.

name: Sürüm

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Sürüm numaraları etiketle aynı mı
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $conf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if ($tag -ne $pkg -or $tag -ne $conf -or $tag -ne $cargo) {
            throw "Etiket $tag; package.json $pkg, tauri.conf.json $conf, Cargo.toml $cargo"
          }
          "VERSION=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - run: npm ci
      # WinDivert resmi sürümünden iner; özetler tutmazsa burada durur.
      - run: npm run engine
      - run: npm test
      - run: npx tauri build

      - name: Kurulum dosyasını ve taşınabilir sürümü adlandır, özetlerini çıkar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          foreach ($name in "RobzDPI-Setup-$env:VERSION.exe", "RobzDPI-Setup.exe") { Copy-Item $setup.FullName "out/$name" }
          ./scripts/portable.ps1 -Version $env:VERSION -Out out
          Get-ChildItem out -File | Where-Object Extension -in '.exe', '.zip' | Sort-Object Name |
            ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } |
            Out-File out/SHA256SUMS.txt -Encoding ascii
          Get-Content out/SHA256SUMS.txt

      # Taşınabilir sürüm açılınca ayarlarını programın yanındaki "data" klasörüne yazmalı, bilgisayara iz bırakmamalı.
      - name: Taşınabilir sürümü dene
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'portable'
          Expand-Archive out/RobzDPI-Portable.zip $dir
          $app = Join-Path $dir 'Robz DPI'
          foreach ($file in 'RobzDPI.exe', 'portable.txt', 'engine/WinDivert.dll', 'engine/WinDivert64.sys') {
            if (-not (Test-Path (Join-Path $app $file))) { throw "zip'te yok: $file" }
          }
          $process = Start-Process (Join-Path $app 'RobzDPI.exe') -PassThru
          Start-Sleep -Seconds 15
          if ($process.HasExited) { throw "uygulama açılmadı (çıkış kodu $($process.ExitCode))" }
          Stop-Process $process -Force
          Start-Sleep -Seconds 2
          # Ayarlar ilk değişiklikte yazılır; arayüzün önbelleği açılışta oluşur ve aynı klasöre gitmelidir.
          if (-not (Test-Path (Join-Path $app 'data/EBWebView'))) { throw "veriler programın yanına yazılmadı" }
          if (Test-Path (Join-Path $env:LOCALAPPDATA 'com.robz.dpi')) { throw "taşınabilir sürüm %LOCALAPPDATA% altına yazdı" }
          Get-ChildItem (Join-Path $app 'data') | Select-Object -ExpandProperty Name

      - name: Sürüm notlarını CHANGELOG.md'den al
        shell: pwsh
        run: |
          $lines = Get-Content CHANGELOG.md -Encoding utf8
          $start = [array]::IndexOf($lines, "## $env:VERSION")
          if ($start -lt 0) { throw "CHANGELOG.md içinde '## $env:VERSION' başlığı yok" }
          $notes = @()
          for ($i = $start + 1; $i -lt $lines.Count -and -not $lines[$i].StartsWith('## '); $i++) { $notes += $lines[$i] }
          ($notes -join "`n").Trim() | Out-File out/notes.md -Encoding utf8

      - name: GitHub sürümünü oluştur
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" out/RobzDPI-Setup-${{ env.VERSION }}.exe out/RobzDPI-Setup.exe out/RobzDPI-Portable-${{ env.VERSION }}-x64.zip out/RobzDPI-Portable.zip out/SHA256SUMS.txt --title "Robz DPI ${{ env.VERSION }}" --notes-file out/notes.md

  # Linux paketleri (.deb, .rpm ve AppImage) aynı sürüme eklenir. Motor önce uçtan uca denenir.
  # Ubuntu 22.04'te derlenir: paketler bu sürümün C kitaplığıyla (glibc 2.35) ve daha yenileriyle çalışır.
  linux:
    needs: release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            src-tauri/engine-bin
      - name: Derleme gereksinimleri
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev rpm libfuse2 file
      - name: Motor programının sürümü etiketle aynı mı
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "^version = \"$version\"" src-tauri/engine-bin/Cargo.toml || { echo "engine-bin/Cargo.toml sürümü $version değil"; exit 1; }
      - run: npm ci
      - run: npm test
      - run: npm run build:linux
      - name: Motoru uçtan uca dene
        run: |
          sudo apt-get install -y ./src-tauri/target/release/bundle/deb/*.deb
          sudo bash scripts/linux-smoke.sh
      - name: Paketleri adlandır ve özetlerini çıkar
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir out
          cp src-tauri/target/release/bundle/deb/*.deb "out/RobzDPI-$version-amd64.deb"
          cp src-tauri/target/release/bundle/deb/*.deb out/RobzDPI-Linux-amd64.deb
          cp src-tauri/target/release/bundle/rpm/*.rpm "out/RobzDPI-$version-x86_64.rpm"
          cp src-tauri/target/release/bundle/rpm/*.rpm out/RobzDPI-Linux-x86_64.rpm
          cp src-tauri/target/release/bundle/appimage/*.AppImage "out/RobzDPI-$version-x86_64.AppImage"
          cp src-tauri/target/release/bundle/appimage/*.AppImage out/RobzDPI-Linux-x86_64.AppImage
          (cd out && sha256sum *.deb *.rpm *.AppImage > SHA256SUMS-linux.txt && cat SHA256SUMS-linux.txt)
      - name: Sürüme ekle
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" out/*.deb out/*.rpm out/*.AppImage out/SHA256SUMS-linux.txt --clobber
